<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고기 대난투 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece2;--panel:#fffaf2;--ink:#2b2121;--mute:#7a6a64;--line:#dccfc0;--raw:#e0566b;--mus:#f2b134;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1515;--panel:#271e1e;--ink:#f6e8da;--mute:#b3a094;--line:#3d3030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1515;--panel:#271e1e;--ink:#f6e8da;--mute:#b3a094;--line:#3d3030;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b3261e;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px;word-break:break-all}
/* lobby */
body:not(.ingame) #stage{z-index:1}body.ingame #stage{z-index:10}body:not(.ingame) #hud{display:none}
body #app{position:fixed;inset:0;z-index:5;max-width:none;margin:0;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(20,14,14,.1),rgba(20,14,14,.6));color:#fff0e2;text-align:center}
#app .sub{color:#fff0e2;text-shadow:0 2px 6px #000;margin:0;max-width:90vw}
#app .help{color:#fff0e2;text-shadow:0 1px 4px #000;margin:0;max-width:92vw;font-size:14px}
#nm{width:min(280px,80vw);margin:0;background:rgba(0,0,0,.55);color:#fff0e2;border-color:#fff0e2;font-size:20px}
.lrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#app #play{width:auto;margin:0;padding:14px 44px;font-size:36px}
.sb{font:inherit;font-size:18px;padding:12px 18px;border:2px solid #fff0e2;border-radius:12px;background:rgba(0,0,0,.55);color:#fff0e2;cursor:pointer}
.sb:hover{background:rgba(224,86,107,.7)}
#rc{width:min(280px,80vw);margin:0;background:rgba(0,0,0,.45);color:#fff0e2;border-color:#f2b134;font-size:15px}
#invbox{width:min(400px,88vw)}#invlink{margin:0;font-size:13px;background:rgba(0,0,0,.55);color:#fff0e2;border-color:#fff0e2}#invmsg{margin-top:6px}
#coinb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;background:rgba(0,0,0,.5);border:2px solid #f2b134;border-radius:999px;padding:4px 16px;font-size:22px;color:#f2b134}
#live{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;background:rgba(0,0,0,.5);border-radius:10px;padding:8px 12px;font-size:15px;text-align:left;max-width:230px}
#live ol{margin:4px 0 6px;padding-left:20px}#live i{font-style:normal;color:#f2b134}#live .fd{color:#c9b8a8;font-size:13px}
#ec{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:20px;color:#f2b134}
#tp{position:absolute;left:16px;bottom:44px;pointer-events:auto;font:inherit;font-size:13px;padding:3px 12px;border:2px solid #fff0e2;border-radius:999px;background:rgba(0,0,0,.5);color:#fff0e2;cursor:pointer}
#wd{--ink:#f6e8da;--bg:#1b1515;--panel:#271e1e;--line:#3d3030;--mute:#b3a094;position:fixed;inset:0;z-index:20;background:rgba(12,8,8,.78);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;color:var(--ink)}
.wp{display:grid;grid-template-columns:280px 1fr;gap:16px;width:min(900px,100%);max-height:100%;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:14px}
@media(max-width:700px){.wp{grid-template-columns:1fr}}
.wl{text-align:center}.wl canvas{width:100%;max-width:260px;height:auto;border-radius:10px;background:#e8dfd0}
#wcoin{font-size:24px;color:var(--mus);margin-top:6px}
.wr{overflow:auto;max-height:78vh}
.wr #opts{background:none;border:0;padding:0}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{font:inherit;padding:6px 18px;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--mus);color:#2b2121;border-color:var(--ink)}.tabs .x{margin-left:auto}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.si{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--bg)}
.si b{font-weight:400}.si span{color:var(--mute);font-size:14px}
.si button{font:inherit;margin-top:4px;padding:5px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--mus);color:#2b2121;cursor:pointer}
.si button.on{background:#fff0e2}
.hint{color:var(--mute);font-size:15px;margin:8px 0}.sl{color:var(--mute);min-width:36px;align-self:center}
h3.sh{margin:14px 0 8px;font-weight:400;color:var(--mus)}
.tabs{flex-wrap:wrap}.kbprev{margin-top:12px;display:flex;justify-content:center;min-height:300px}.kbprev .vk2{animation:none}
.bar{stroke-dasharray:20;stroke-dashoffset:20;animation:vkarc .4s forwards;filter:drop-shadow(0 0 5px #ff4ff0)}
.splat{transform-box:fill-box;transform-origin:center;animation:vksplat .8s ease-out both}
@keyframes vksplat{0%{transform:scale(.5);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.9}}
.vk2.chaos .vk-em{filter:drop-shadow(0 0 16px #d83cff)}.si.sel{border-color:var(--mus)}#gunsk .si{cursor:pointer}.gsw{display:block;width:46px;height:14px;border-radius:7px;border:3px solid}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px}
#app{max-width:980px;margin:0 auto;padding:14px}
h1{margin:0;font-size:clamp(38px,9vw,68px);line-height:1.05;display:inline-block;background:var(--raw);color:#fff0e2;padding:6px 18px 10px;border-radius:6px;transform:rotate(-1.5deg);box-shadow:5px 5px 0 var(--ink)}
h1 small{font-size:.45em;color:var(--mus);margin-left:8px}
.sub{margin:18px 0 14px;color:var(--mute)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
.pv{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:10px;text-align:center}
.pv canvas{width:100%;max-width:260px;height:auto;border-radius:8px}
input{font:inherit;width:100%;box-sizing:border-box;margin-top:8px;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
#opts{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:6px 14px 12px}
.grp{margin-top:10px}.grp b{display:block;margin-bottom:6px;font-weight:400;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:7px}
.row button{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.row button.dot::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #3a1f1f}
.row button.on{background:var(--mus);color:#2b2121;border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--raw);outline-offset:2px}
#play{font:inherit;font-size:30px;margin-top:18px;width:100%;padding:12px;background:var(--raw);color:#fff0e2;border:2px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.help{margin-top:14px;color:var(--mute);font-size:15px}
/* game */
#stage{position:fixed;inset:0;background:#000;z-index:10;color:#fff0e2;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);text-shadow:0 2px 4px #000}
#tm{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:42px}
#tm.low{color:#ff4655}
#sc{position:absolute;top:12px;left:14px;font-size:17px;line-height:1.35}
#sc .me{color:var(--mus)}
#kf{position:absolute;top:12px;right:14px;text-align:right;font-size:17px;line-height:1.35}
#hp{position:absolute;left:16px;bottom:16px;width:min(240px,40vw);height:16px;background:rgba(0,0,0,.5);border:2px solid #fff0e2;border-radius:8px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:#4caf50}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh::before,#xh::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#xh::before{left:-11px;top:-1px;width:22px;height:2px}#xh::after{left:-1px;top:-11px;width:2px;height:22px}
#xh.hm::before,#xh.hm::after{background:#ff4655}
#dv{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,30,50,.8));opacity:0}
#cn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;text-shadow:0 4px 10px #000}
#msg{position:absolute;bottom:18%;width:100%;text-align:center;font-size:22px}
#kb{position:absolute;left:0;width:100%;bottom:24%;display:flex;justify-content:center}
#kb .w{animation:kbin 2.3s both;text-align:center}
#kb .band{background:rgba(18,12,14,.88);border-top:4px solid #ff4655;border-bottom:4px solid #ff4655;padding:6px 64px 8px;transform:skewX(-15deg)}
#kb .band>div{transform:skewX(15deg)}
#kb b{display:block;font-weight:400;font-style:italic;font-size:clamp(34px,6vw,54px);line-height:1.1;animation:pop .3s both}
#kb b.m{color:#ff4655}#kb span{font-size:18px}
#kb .pips{margin-top:8px;color:#ff4655;font-size:22px;letter-spacing:6px}
@keyframes kbin{0%{opacity:0;transform:scaleX(.15)}7%{opacity:1;transform:scaleX(1.08)}12%{transform:scaleX(1)}85%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(2)}100%{transform:scale(1)}}
.vk{display:flex;flex-direction:column;align-items:center;animation:vkio 2.4s both}
.vk-rib{position:relative;display:flex;align-items:center;gap:20px;padding:10px 56px 12px;background:linear-gradient(90deg,rgba(14,16,22,0) 0%,rgba(14,16,22,.92) 14%,rgba(30,34,46,.96) 50%,rgba(14,16,22,.92) 86%,rgba(14,16,22,0) 100%);clip-path:polygon(0 50%,5% 0,95% 0,100% 50%,95% 100%,5% 100%);animation:vkw .35s cubic-bezier(.2,.9,.3,1) both}
.vk-rib::before,.vk-rib::after{content:"";position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#ff4655,#fff,#ff4655,transparent)}
.vk-rib::before{top:0}.vk-rib::after{bottom:0}
.vk-l,.vk-r{flex:none;width:20px;height:20px;background:#ff4655;transform:rotate(45deg);box-shadow:0 0 14px #ff4655}
.vk-c{text-align:center;transform:skewX(-8deg)}
.vk-c em{display:block;font-style:normal;font-size:13px;letter-spacing:.4em;color:#ff4655}
.vk-c b{display:block;font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:.04em;text-shadow:0 0 18px rgba(255,70,85,.7);animation:vkpop .4s .08s both}
.vk-c b.m{color:#ff4655}.vk-c span{font-size:16px;color:#ece8e1}
.vk-pips{display:flex;gap:14px;margin-top:12px}
.vk-pips u{width:15px;height:15px;border:2px solid #ff4655;transform:rotate(45deg);animation:vkpip .28s both}
.vk-pips u.on{background:#ff4655;box-shadow:0 0 10px #ff4655}.vk-pips u.off{border-color:rgba(255,255,255,.28)}
@keyframes vkio{0%{opacity:0}6%{opacity:1}86%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
@keyframes vkw{0%{transform:scaleX(.1);opacity:0;filter:brightness(3)}60%{transform:scaleX(1.06);filter:brightness(1.6)}100%{transform:scaleX(1);filter:none}}
@keyframes vkpop{0%{transform:scale(1.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes vkpip{0%{transform:rotate(45deg) scale(0)}70%{transform:rotate(45deg) scale(1.45)}100%{transform:rotate(45deg) scale(1)}}
#kb{bottom:7%}
.vk2{display:flex;flex-direction:column;align-items:center;animation:vkio 2.4s both}
.vk-em{width:min(170px,34vw);height:auto;filter:drop-shadow(0 0 10px rgba(53,240,200,.35));animation:vkpop2 .5s cubic-bezier(.2,.9,.3,1.2) both}
.vk2 .ac{stroke:var(--ac)}.arc{stroke-dasharray:100;stroke-dashoffset:100;animation:vkarc .6s .1s forwards}
.r1,.r2{transform-box:fill-box;transform-origin:center}.r1{animation:vkspin 9s linear infinite}.r2{animation:vkspin 6s linear infinite reverse}
.em{transform-box:fill-box;transform-origin:center;animation:vkem 1.1s ease-in-out infinite alternate}
.vk-t{margin-top:-6px;text-align:center}.vk-t em{display:block;font-style:normal;font-size:12px;letter-spacing:.4em;color:var(--ac)}
.vk-t b{display:block;font-weight:400;font-size:clamp(28px,5vw,44px);line-height:1.05;text-shadow:0 2px 8px #000;animation:vkpop .4s .1s both}
.vk-t b.m{color:var(--ac)}.vk-t span{font-size:15px;text-shadow:0 1px 4px #000}
.vk2 .vk-pips u{border-color:var(--ac)}.vk2 .vk-pips u.on{background:var(--ac);box-shadow:0 0 10px var(--ac)}.vk2 .vk-pips u.off{border-color:rgba(255,255,255,.28)}
@keyframes vkpop2{0%{transform:scale(1.7) rotate(-14deg);opacity:0;filter:brightness(3)}100%{transform:none;opacity:1}}
@keyframes vkarc{to{stroke-dashoffset:0}}
.vk-em{overflow:visible}.vk2.ace .vk-em{filter:drop-shadow(0 0 18px #35f0c8)}
.side{transform-box:fill-box;transform-origin:center;animation:vkside .5s .15s both}
.wave{transform-box:fill-box;transform-origin:center;animation:vkwave .9s .1s both}
@keyframes vkside{0%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:scaleX(1)}}
@keyframes vkwave{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}@keyframes vkspin{to{transform:rotate(360deg)}}@keyframes vkem{to{transform:scale(1.05)}}
#back{position:absolute;right:14px;bottom:14px;pointer-events:auto;font:inherit;font-size:15px;padding:6px 14px;border:2px solid #fff0e2;border-radius:8px;background:rgba(0,0,0,.5);color:#fff0e2;cursor:pointer}
#fb{position:absolute;right:26px;bottom:70px;width:92px;height:92px;border-radius:50%;pointer-events:auto;font:inherit;font-size:20px;border:3px solid #fff0e2;background:rgba(224,86,107,.6);color:#fff0e2}
#res{position:absolute;inset:0;pointer-events:auto;background:rgba(29,22,22,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
#res h2{margin:0;font-size:clamp(28px,6vw,48px);font-weight:400;color:var(--mus)}
#res ol{margin:0;padding:0;list-style:none;min-width:min(340px,86%)}
#res li{display:flex;justify-content:space-between;padding:4px 10px;border-bottom:1px solid #4a3a3a}
#res li.me{color:var(--mus)}
#res .btns{display:flex;gap:10px;margin-top:8px}
#res button{font:inherit;padding:8px 18px;border:2px solid #2b2121;border-radius:10px;background:var(--mus);color:#2b2121;cursor:pointer}
#res button+button{background:#fff0e2}
#vote{position:fixed;inset:0;z-index:30;background:#1d1616;color:#fff0e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow:auto}
#vote h2{margin:0;font-weight:400;font-size:clamp(30px,6vw,52px);background:var(--raw);padding:4px 22px 8px;border-radius:6px;transform:rotate(-1deg);box-shadow:5px 5px 0 #000}
#vote p{margin:0;color:#c9b8a8}
.vt{width:min(520px,86vw);height:12px;border:2px solid #fff0e2;border-radius:8px;overflow:hidden}.vt i{display:block;height:100%;width:100%;background:var(--mus)}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
.card{font:inherit;color:#fff0e2;width:210px;min-height:170px;background:#2b2121;border:3px solid var(--c);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .12s}
.card b{font-weight:400;font-size:26px}.card span{font-size:15px;color:#c9b8a8}.card em{font-style:normal;font-size:22px;color:var(--mus)}
.card u{text-decoration:none;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.card u s{text-decoration:none;font-size:13px;background:#3d3030;border-radius:999px;padding:1px 8px}.card u s.me{background:var(--mus);color:#2b2121}
.card.on{background:var(--c);transform:translateY(-4px)}.card.on span{color:#fff0e2}
.card.win{outline:4px solid var(--mus);animation:wn .5s 2}
@keyframes wn{50%{transform:scale(1.06)}}
.vc{font:inherit;margin-top:6px;padding:6px 18px;border:2px solid #fff0e2;border-radius:8px;background:transparent;color:#fff0e2;cursor:pointer}
</style>
</head>
<body>
<main id="app">
  <div id="coinb">🪙 0</div>
  <div id="live"></div>
  <h1>고기 대난투<small>3D</small></h1>
  <p class="sub">손발이 돋아난 고기들의 1인칭 총격전. 킬을 모아 코인으로 장신구를 사세요.</p>
  <input id="nm" maxlength="8" placeholder="이름을 입력하세요" aria-label="이름">
  <input id="rc" maxlength="24" placeholder="방 코드 (비우면 온라인 자동 매칭)" aria-label="방 코드">
  <button id="inv" class="sb" style="font-size:15px;padding:8px 14px">친구 초대 링크 만들기</button>
  <div id="invbox" hidden><input id="invlink" readonly aria-label="초대 링크"><p id="invmsg" class="help"></p></div>
  <div class="lrow"><button id="openAv" class="sb">아바타 꾸미기</button><button id="play">플레이</button><button id="openShop" class="sb">상점</button></div>
  <button id="openGun" class="sb" style="font-size:15px;padding:8px 14px">총 스킨 선택</button>
  <p class="help">플레이를 누르면 온라인 플레이어와 자동으로 매칭돼요. 사람이 들어오면 AI가 한 명씩 빠져요. (방 코드를 넣으면 비공개 방)</p>
  <p class="help">WASD 이동 · 마우스 조준 · 클릭 발사 · 스페이스 점프 · ESC 마우스 해제 (모바일: 왼쪽 드래그 이동, 오른쪽 드래그 조준, 발사 버튼)</p>
</main>
<section id="wd" hidden>
  <div class="wp">
    <div class="wl"><canvas id="pv" width="260" height="260"></canvas><div id="wcoin">🪙 0</div></div>
    <div class="wr">
      <div class="tabs"><button id="tb0" class="on">꾸미기</button><button id="tb2">총 스킨</button><button id="tb3">킬 배너</button><button id="tb1">상점</button><button id="wx" class="x">닫기</button></div>
      <div id="opts"></div>
      <div id="shopnav" class="row" style="margin-bottom:8px" hidden><button id="sn0" class="on">장신구</button><button id="sn1">총 스킨</button></div>
      <div id="shop" hidden></div>
      <div id="shopg" hidden></div>
      <div id="gunsk" hidden></div>
      <div id="kbsel" hidden></div>
    </div>
  </div>
</section>
<section id="vote" hidden></section>
<div id="err" hidden></div>
<section id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="tm"></div><div id="ec"></div><div id="sc"></div><div id="kf"></div>
    <div id="hp"><i></i></div><div id="xh"></div><div id="dv"></div><div id="kb"></div><div id="cn"></div><div id="msg"></div>
    <button id="tp">3인칭</button><button id="back">나가기</button><button id="fb" hidden>발사</button><div id="res" hidden></div>
  </div>
